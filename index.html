<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="wochenplan-id" content="0b8f1ae6-6f5c-483d-944f-a3567dc47eb0">
  <title>Mein Wochenplan</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body id="wochen-seite">
<section id="anmeldung" class="login-seite"><main class="login-karte">
    <span class="logo" aria-hidden="true">W.</span>
    <p class="klein">DEIN PLATZ FÜR EINE KLARE WOCHE</p>
    <h1>Schön, dass<br>du da bist.</h1>
    <p class="beschreibung">Melde dich an und behalte deine Woche im Blick.</p>

    <form id="login-formular">
      <label for="passwort">Dein Passwort</label>
      <input id="passwort" name="passwort" type="password"
             placeholder="Passwort eingeben" autocomplete="current-password"
             aria-describedby="fehlermeldung" required>
      <p id="fehlermeldung" class="fehler" role="alert"></p>
      <button type="submit">Zur Wochenübersicht <span aria-hidden="true">→</span></button>
    </form>
    <p class="fussnote">Ein kleiner Plan. Mehr Raum für deinen Alltag.</p>
    <noscript>Bitte aktiviere JavaScript, um den Kalender zu öffnen.</noscript>
  </main></section>
</body>
</html>
